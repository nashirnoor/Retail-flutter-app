name: myapp
description: "Inventory Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local SQLite database
  sqflite: ^2.3.3
  path: ^1.9.0

  # UI & fonts
  google_fonts: ^6.2.1
  intl: ^0.19.0
  fl_chart: ^0.70.0

  # State management
  provider: ^6.1.2
  pdf: ^3.12.0
  printing: ^5.14.3
  url_launcher: ^6.3.2
  flutter_staggered_animations: ^1.1.1
  share_plus: ^10.1.0
  shared_preferences: ^2.3.5
  file_picker: ^8.1.4
  simple_barcode_scanner: ^0.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
